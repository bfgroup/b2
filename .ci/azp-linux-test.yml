parameters:
  - name: b2_opts
    type: string
    default: ""

steps:
  - bash: |
      curl -L -o - https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS-2023.PUB | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
      echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
    condition: in(variables.TOOLSET, 'intel-linux')
    displayName: Install Intel oneAPI CXX
  - bash: |
      set -e
      uname -a
      ./.ci/linux-cxx-install.sh
      python3 --version
    displayName: Install
  - bash: |
      echo "##vso[task.setvariable variable=BASH_ENV;]/opt/intel/oneapi/setvars.sh"
    condition: in(variables.TOOLSET, 'intel-linux')
    displayName: Setup Intel oneAPI CXX
  - bash: |
      set -e
      cd src/engine
      set PATH=${PATH};${CXX_PATH}
      ./build.sh ${TOOLSET}
      ./b2 -v
      cd ../..
      echo "using ${TOOLSET%%-[0-9]*} : : ${CXX} ;" > ${HOME}/user-config.jam
    displayName: Build
  - bash: |
      set -e
      echo "Available system locales:"
      locale -a
      echo "Switch to C.UTF-8 locale."
      export LC_ALL=C.UTF-8
      cd test
      ./test_all.py ${TOOLSET}
      cd ..
    displayName: Test
  - bash: |
      set -e
      ./src/engine/b2 b2 warnings-as-errors=on variant=debug,release ${TOOLSET:+toolset=$TOOLSET} ${{ parameters.b2_opts }}
    displayName: "No Warnings"
  - bash: |
      set -e
      ./bootstrap.sh ${TOOLSET}
      ./b2 --prefix=$HOME/temp/.b2 install ${TOOLSET:+toolset=$TOOLSET} ${{ parameters.b2_opts }}
      rm ./b2
      export PATH=$HOME/temp/.b2/bin:$PATH
      cd $HOME
      touch build.jam
      b2 -v
      b2 -n --debug-configuration ${TOOLSET:+toolset=$TOOLSET} ${{ parameters.b2_opts }}
    displayName: Bootstrap
